# =====================================================================
# WeKnora @ 绿联 DXP4800 Plus NAS  -  v3 (UGREEN Container Manager 兼容)
# ---------------------------------------------------------------------
# NAS 规格：Intel Pentium Gold 8505 (5c/6t, x86_64) / 16GB DDR5 / LAN1=192.168.2.3
# 编排策略：profiles 让高级组件（neo4j/langfuse/odl）按需启一个，
#          不同时跑，避开 16GB RAM 瓶颈。
#
# 上传到 NAS：把 .env 和 config/config.yaml 放在 /volume1/docker/weknora/env-share/；
#            把这份 yml 放在 /volume1/docker/weknora/docker-compose.nas.yml
#            （UGREEN Container Manager 读这个路径）
#
# 启动基础栈（在 Container Manager UI Import 之后）：
#   docker compose -f docker-compose.nas.yml --profile base up -d
#
# 高级组件单独启（不在 base 内）：
#   docker compose -f docker-compose.nas.yml --profile neo4j up -d
#   docker compose -f docker-compose.nas.yml --profile langfuse up -d
#   docker compose -f docker-compose.nas.yml --profile odl-hybrid up -d
# =====================================================================

# Bind-mount source paths that must EXIST on the NAS BEFORE import:
#   /volume1/docker/weknora/env-share/.env          (already exists)
#   /volume1/docker/weknora/env-share/config.yaml   (already exists)
#   /volume1/docker/weknora/skills-preloaded/       <-- you need to create this
#   /volume1/docker/weknora/data-files/             <-- you need to create this (for uploaded docs)
#   /volume1/docker/weknora/source/                 <-- 整个 WeKnora 仓库（启用 build 时必填）

services:
  # ========== 基础栈：所有 profile 必起 ==========

  app:
    image: wechatopenai/weknora-app:${WEKNORA_VERSION:-latest}
    # 本地源码构建：当 build 存在时，compose 优先 build，产出的镜像会带 image 指定的 tag
    # （NAS 上需要把整个 WeKnora 仓库放在 /volume1/docker/weknora/source/ 下）
    build:
      context: ./source
      dockerfile: docker/Dockerfile.app
      args:
        - APK_MIRROR_ARG=${APK_MIRROR_ARG:-}
        # NAS Docker build 沙箱连不上 proxy.golang.org — 切到国内镜像(逗号分隔,direct 是 fallback 直连)
        - GOPROXY_ARG=${GOPROXY_ARG:-https://goproxy.cn,direct}
    container_name: weknora-app
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [base]
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - /volume1/docker/weknora/data-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ./env-share/config.yaml:/app/config/config.yaml:ro
      - ./skills-preloaded:/app/skills/preloaded
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - TZ=${TZ:-Asia/Shanghai}
      - DB_DRIVER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - STREAM_MANAGER_TYPE=redis
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DOCREADER_ADDR=docreader:50051
      - DOCREADER_TRANSPORT=grpc
      - APP_EXTERNAL_URL=${APP_EXTERNAL_URL:-http://192.168.2.3}
      # Neo4j / GraphRAG — app 端需要这些才会初始化 Neo4j 客户端(见 container.go:1460)
      # 容器端启动方式: docker compose --profile neo4j up -d neo4j
      - NEO4J_ENABLE=${NEO4J_ENABLE:-false}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docreader:
        condition: service_started
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: wechatopenai/weknora-ui:${WEKNORA_VERSION:-latest}
    container_name: weknora-frontend
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [base]
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - APP_HOST=app
      - APP_PORT=8080
      - APP_SCHEME=http
    depends_on:
      app:
        condition: service_healthy
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    container_name: weknora-postgres
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [base]
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - weknora_postgres_data:/var/lib/postgresql/data
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: weknora-redis
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [base]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
    volumes:
      - weknora_redis_data:/data
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  docreader:
    image: wechatopenai/weknora-docreader:${WEKNORA_VERSION:-latest}
    # docreader Dockerfile 需要项目根作为 context（它要 COPY docreader/pyproject.toml 等）
    build:
      context: ./source
      dockerfile: docker/Dockerfile.docreader
      args:
        - APT_MIRROR=${APT_MIRROR:-}
        # NAS Docker build 沙箱连不上 github.com — 强制离线,依赖 source/packages/ 里的预下载文件
        - PROTOC_ALLOW_ONLINE=false
        - GRPC_HEALTH_PROBE_ALLOW_ONLINE=false
    container_name: weknora-docreader
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [base]
    expose:
      - "50051"
    environment:
      - DOCREADER_GRPC_PORT=50051
      - DOCREADER_GRPC_MAX_WORKERS=${DOCREADER_GRPC_MAX_WORKERS:-4}
      - DOCREADER_ODL_HYBRID=${DOCREADER_ODL_HYBRID:-off}
      - DOCREADER_ODL_HYBRID_URL=${DOCREADER_ODL_HYBRID_URL:-http://odl-hybrid:5002}
      - DOCREADER_MARKITDOWN_MAX_WORKERS=${DOCREADER_MARKITDOWN_MAX_WORKERS:-1}
      - DOCREADER_GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:-}
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - weknora_docreader_cache:/tmp/docreader
      - /volume1/docker/weknora/data-files:/data/files:ro
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G

  sandbox:
    image: wechatopenai/weknora-sandbox:latest
    container_name: weknora-sandbox
    profiles: [base]
    command: ["sleep", "infinity"]
    networks: [weknora-net]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M

  # ========== Neo4j（高级组件，4 GB RAM 推荐独占） ==========

  neo4j:
    image: neo4j:5
    container_name: weknora-neo4j
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [neo4j]
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_dbms_memory_heap_max__size=3G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - weknora_neo4j_data:/data
      - weknora_neo4j_logs:/logs
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4.5G

  # ========== Langfuse 自建（高级组件，3-4 GB） ==========

  langfuse-web:
    image: langfuse/langfuse:2
    container_name: weknora-langfuse-web
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [langfuse]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${LANGFUSE_DB_NAME:-langfuse}
      - NEXTAUTH_URL=http://192.168.2.3:3000
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:-}
      - SALT=${LANGFUSE_SALT:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/${LANGFUSE_REDIS_DB:-1}
    ports:
      - "${LANGFUSE_WEB_PORT:-3000}:3000"
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: weknora-langfuse-ch
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [langfuse]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - weknora_langfuse_clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_USER=${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  langfuse-minio:
    image: minio/minio:latest
    container_name: weknora-langfuse-minio
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [langfuse]
    command: server /data --console-address ":9101"
    environment:
      - MINIO_ROOT_USER=${LANGFUSE_MINIO_USER:-langfuseminio}
      - MINIO_ROOT_PASSWORD=${LANGFUSE_MINIO_PASSWORD:-langfuseminiosecret}
    volumes:
      - weknora_langfuse_minio_data:/data
    ports:
      - "${LANGFUSE_MINIO_S3_PORT:-9100}:9000"
      - "${LANGFUSE_MINIO_CONSOLE_PORT:-9101}:9001"
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ========== MinIO（WeKnora 自己的对象存储，可选） ==========

  minio:
    image: minio/minio:latest
    container_name: weknora-minio
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [minio]
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - weknora_minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ========== OpenDataLoader hybrid（高级组件，2-3 GB） ==========

  odl-hybrid:
    image: weknora-odl-hybrid:local
    container_name: weknora-odl-hybrid
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [odl-hybrid]
    environment:
      - ODL_HYBRID_EXTRA_ARGS=${ODL_HYBRID_EXTRA_ARGS:---no-ocr}
    ports:
      - "${ODL_HYBRID_PORT:-5002}:5002"
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G

  # ========== SearXNG（可选网络搜索） ==========

  searxng:
    image: searxng/searxng:latest
    container_name: weknora-searxng
    env_file:
      - /volume1/docker/weknora/env-share/.env
    profiles: [searxng]
    volumes:
      - weknora_searxng_config:/etc/searxng
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ========== 文档解析 OCR（自部署，可与 Neo4j/Langfuse 互斥启停） ==========

  mineru:
    # MinerU(opendatalab/MinerU) 自部署服务。
    # NAS 上没 GPU,CPU 模式较慢,RAM 重,测完建议 down。
    image: opendatalab/mineru:latest
    container_name: weknora-mineru
    profiles: [ocr]
    hostname: mineru
    environment:
      - MINERU_MODEL_SOURCE=modelscope   # 国内镜像加速,model 不走 huggingface
    ports:
      - "${MINERU_PORT:-18765}:8000"     # WeKnora 自部署 endpoint
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G

  paddleocr-vl:
    # PaddleOCR-VL 自部署服务。镜像名按 paddlepaddle 官方 docs 写,
    # 如果 image 拉不到请把这一段 docker pull 试试或换 paddleocr/paddlex 系列。
    image: paddleocr/paddlex-inference-server:latest
    container_name: weknora-paddleocr-vl
    profiles: [ocr]
    hostname: paddleocr-vl
    ports:
      - "${PADDLEOCR_PORT:-18770}:8080"
    networks: [weknora-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 5G

networks:
  weknora-net:
    driver: bridge

volumes:
  docreader-tmp:
  weknora_postgres_data:
  weknora_redis_data:
  weknora_minio_data:
  weknora_neo4j_data:
  weknora_neo4j_logs:
  weknora_langfuse_clickhouse_data:
  weknora_langfuse_minio_data:
  weknora_docreader_cache:
  weknora_searxng_config:
